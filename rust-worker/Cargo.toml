[package]
name = "compute-swarm-worker"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Cross-platform worker for the CaMaLabs universal compute swarm"

[dependencies]
anyhow = "1"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
urlencoding = "2"
