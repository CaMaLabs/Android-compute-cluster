name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coordinator/requirements.txt -r worker/requirements.txt pytest httpx
      - run: pytest -q

  onnx-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements.txt -r worker/requirements-onnx.txt pytest onnx
      - run: pytest -q tests/test_onnx_accelerator.py

  rust-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path rust-worker/Cargo.toml

  android-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - working-directory: android-worker
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: compute-swarm-android-debug
          path: android-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
