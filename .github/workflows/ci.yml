name: CI

on:
  push:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coordinator/requirements.txt -r worker/requirements.txt pytest httpx
      - run: pytest -q

  onnx-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements.txt -r worker/requirements-onnx.txt pytest onnx
      - run: pytest -q tests/test_onnx_accelerator.py

  rust-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path rust-worker/Cargo.toml

  android-worker:
    runs-on: ubuntu-latest
    env:
      SWARM_SIGNING_KEYSTORE: ${{ github.workspace }}/android-worker/.signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: android-worker/.signing/debug.keystore
          key: compute-swarm-android-debug-signing-v2
      - name: Create signing key on first build
        run: |
          mkdir -p android-worker/.signing
          if [ ! -f "$SWARM_SIGNING_KEYSTORE" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$SWARM_SIGNING_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Compute Swarm Debug,O=CaMaLabs,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - working-directory: android-worker
        run: gradle :app:assembleDebug
      - name: Show APK signing certificate
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs android-worker/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: compute-swarm-android-debug
          path: android-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Private signing-key backup
        uses: actions/upload-artifact@v4
        with:
          name: compute-swarm-signing-backup
          path: android-worker/.signing/debug.keystore
          retention-days: 7
          if-no-files-found: error
