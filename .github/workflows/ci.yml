name: CI

on:
  push:
  schedule:
    - cron: "17 4 */5 * *"

permissions:
  actions: read
  contents: write

jobs:
  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@d0a68cb29196eafce908de76ec596a7e9ca049da
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coordinator/requirements.txt -r worker/requirements.txt pytest httpx
      - run: pytest -q
      - name: Validate Linux scripts
        run: bash -n scripts/*.sh
      - name: Validate Windows scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw scripts/install-windows.ps1))
          [void][scriptblock]::Create((Get-Content -Raw scripts/install-windows-auto.ps1))
          [void][scriptblock]::Create((Get-Content -Raw scripts/auto-update-windows.ps1))

  onnx-worker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@d0a68cb29196eafce908de76ec596a7e9ca049da
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements.txt -r worker/requirements-onnx.txt pytest onnx
      - run: pytest -q tests/test_onnx_accelerator.py

  rust-worker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@d0a68cb29196eafce908de76ec596a7e9ca049da
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path rust-worker/Cargo.toml

  windows-installer:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish x64 installer
        shell: pwsh
        run: |
          dotnet publish windows-installer/ComputeSwarmWorkerInstaller.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o windows-installer/out/x64
      - name: Publish ARM64 installer
        shell: pwsh
        run: |
          dotnet publish windows-installer/ComputeSwarmWorkerInstaller.csproj `
            -c Release -r win-arm64 --self-contained true `
            -p:PublishSingleFile=true `
            -o windows-installer/out/arm64
      - name: Smoke test x64 installer executable
        shell: pwsh
        run: |
          & windows-installer/out/x64/ComputeSwarmWorkerInstaller.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage installer executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-installer/dist | Out-Null
          Copy-Item windows-installer/out/x64/ComputeSwarmWorkerInstaller.exe windows-installer/dist/ComputeSwarmWorkerInstaller.exe
          Copy-Item windows-installer/out/arm64/ComputeSwarmWorkerInstaller.exe windows-installer/dist/ComputeSwarmWorkerInstaller-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: compute-swarm-windows-installer
          path: windows-installer/dist/*.exe
          if-no-files-found: error
      - name: Publish Windows installers into repository
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          New-Item -ItemType Directory -Force releases | Out-Null
          Copy-Item windows-installer/dist/ComputeSwarmWorkerInstaller.exe releases/ComputeSwarmWorkerInstaller.exe -Force
          Copy-Item windows-installer/dist/ComputeSwarmWorkerInstaller-arm64.exe releases/ComputeSwarmWorkerInstaller-arm64.exe -Force
          git add releases/ComputeSwarmWorkerInstaller.exe releases/ComputeSwarmWorkerInstaller-arm64.exe
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -gt 0) {
            git commit -m "Publish Windows worker installer [skip ci]"
            git push
          }

  android-worker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SWARM_SIGNING_KEYSTORE: ${{ github.workspace }}/android-worker/.signing/debug.keystore
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@d0a68cb29196eafce908de76ec596a7e9ca049da
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Restore canonical 0.5 signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: android-worker/.signing/debug.keystore
          key: compute-swarm-signing-958a2b10-v1
      - name: Bootstrap canonical key from private Actions backup
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android-worker/.signing /tmp/swarm-signing
          curl --fail --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9006247131/zip \
            -o /tmp/swarm-signing/signing.zip
          unzip -o /tmp/swarm-signing/signing.zip -d android-worker/.signing
          test -f "$SWARM_SIGNING_KEYSTORE"
      - name: Verify canonical signing certificate
        run: |
          ACTUAL=$(keytool -list -v -keystore "$SWARM_SIGNING_KEYSTORE" -storepass android -alias androiddebugkey \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          EXPECTED=958a2b1005e336510c9f4eaa06ef0bd0bf1c38a31901ba17ed8fee6bc2cfe692
          echo "Signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - working-directory: android-worker
        run: gradle :app:assembleDebug
      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-worker/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-worker/app/build/outputs/apk/debug/app-debug.apk \
            | grep -qi '958a2b1005e336510c9f4eaa06ef0bd0bf1c38a31901ba17ed8fee6bc2cfe692'
      - uses: actions/upload-artifact@v4
        with:
          name: compute-swarm-android-debug
          path: android-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK into repository
        if: github.ref == 'refs/heads/agent/universal-compute-swarm' || github.ref == 'refs/heads/main'
        run: |
          mkdir -p releases
          cp android-worker/app/build/outputs/apk/debug/app-debug.apk releases/compute-swarm-worker.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/compute-swarm-worker.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed Android APK [skip ci]"
            git push
          fi

  signing-key-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@d0a68cb29196eafce908de76ec596a7e9ca049da
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
      - name: Keep canonical signing cache active
        uses: actions/cache@v4
        with:
          path: android-worker/.signing/debug.keystore
          key: compute-swarm-signing-958a2b10-v1
          fail-on-cache-miss: true
